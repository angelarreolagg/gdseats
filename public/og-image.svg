<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source for og-image.png. Editable; the PNG beside it is what ships, because no
  social scraper renders SVG.

  Regenerate with `pnpm og:build` (see scripts/buildOgImage.sh).

  Two things about this file look wrong and are not:

  1. It is a 1200x1200 SQUARE whose artwork sits in a 630-tall band, offset 285
     from the top by the transform below. Quick Look only emits square
     thumbnails, so a 1200x630 document comes out letterboxed and the crop back
     to 630 has to guess where the artwork is. Centring it in a square makes the
     centre crop exact.
  2. The width/height attributes are HALF the viewBox. Quick Look lays an SVG out
     like a web page in a viewport near 775px, so a document declaring 1200 gets
     clipped on the right. Declaring 600 fits, and the vector is rasterised up to
     the 1200 thumbnail with no loss.

  XML forbids a double hyphen inside a comment, so CSS custom property names
  cannot be written out here. The colours are the literal values of psl-page,
  psl-accent, psl-wordmark-lead and psl-muted from the dark block of
  src/shared/styles/theme.css.

  Pinned to the dark palette for the same reason TeamsHero is: the brand mark is
  a bright-green seat and #a0f700 is 1.33:1 on white, so a light card would
  swallow the logo.

  The type is filled here rather than stroked, so the overlapping-contour problem
  that forces the hero off system-ui does not apply. The font stack matches the
  hero anyway, so the two read as one brand.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="600" height="600" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="glow" cx="0.16" cy="0.5" r="0.75">
      <stop offset="0%" stop-color="#a0f700" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#a0f700" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#a0f700" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- The card itself, 1200x630, centred in the square: (1200 - 630) / 2 = 285. -->
  <g transform="translate(0, 285)">
    <rect width="1200" height="630" fill="#040811" />
    <rect width="1200" height="630" fill="url(#glow)" />

    <!-- The seat mark, reusing the shipped icon rather than a second copy of the
         artwork that could drift from it. -->
    <image xlink:href="icon-512.png" href="icon-512.png"
           x="86" y="66" width="96" height="96" />

    <text x="204" y="130"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="30" font-weight="700" letter-spacing="7" fill="#93a1b5">G&amp;D SEATS</text>

    <text x="88" y="332"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="116" font-weight="800" letter-spacing="-2" fill="#d3d7db">SOME SEATS</text>

    <text x="88" y="450"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="116" font-weight="800" letter-spacing="-2" fill="#a0f700">MEAN MORE</text>

    <text x="92" y="542"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="31" font-weight="500" fill="#93a1b5">AI-priced NFL personal seat licenses</text>

    <rect x="92" y="574" width="128" height="4" rx="2" fill="#a0f700" />
  </g>
</svg>
