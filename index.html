<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Everything below is stated a second time in src/shared/config/site.ts.
      That duplication is deliberate: a social scraper (LinkedIn, Slack, X) fetches
      this file and never runs the bundle, so the tags have to exist in the markup
      — and static markup cannot import TypeScript. Change one, change the other.

      `useDocumentMeta` rewrites the title, description, og:title, og:description
      and canonical at runtime as the user moves between screens. It edits these
      exact nodes rather than appending new ones, so do not remove them.
    -->
    <title>G&amp;D Seats — AI-priced NFL personal seat licenses</title>
    <meta
      name="description"
      content="Browse NFL personal seat licenses on an interactive seat map and see an AI valuation on every listing before you offer. Frontend demo, mock data."
    />
    <link rel="canonical" href="https://gdseats.vercel.app/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph. og:image must be absolute — a relative path yields no card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="G&amp;D Seats" />
    <meta property="og:title" content="G&amp;D Seats — AI-priced NFL personal seat licenses" />
    <meta
      property="og:description"
      content="Browse NFL personal seat licenses on an interactive seat map and see an AI valuation on every listing before you offer. Frontend demo, mock data."
    />
    <meta property="og:url" content="https://gdseats.vercel.app/" />
    <meta property="og:image" content="https://gdseats.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="G&amp;D Seats — some seats mean more. A demo marketplace for NFL personal seat licenses."
    />
    <!--
      The static markup is English and stays that way — see the note in
      src/shared/config/site.ts. `og:locale:alternate` is how a scraper is told
      the other three exist without a second URL to point at, which there isn't:
      the app holds the screen in React state, and locale routing (`/es/…`) would
      advertise addresses that all resolve to this same document.

      `useDocumentMeta` rewrites `og:locale` at runtime to match the language the
      visitor is actually reading, so the live DOM never contradicts itself.
    -->
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_MX" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta property="og:locale:alternate" content="ja_JP" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="G&amp;D Seats — AI-priced NFL personal seat licenses" />
    <meta
      name="twitter:description"
      content="Browse NFL personal seat licenses on an interactive seat map and see an AI valuation on every listing before you offer. Frontend demo, mock data."
    />
    <meta name="twitter:image" content="https://gdseats.vercel.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="G&amp;D Seats — some seats mean more. A demo marketplace for NFL personal seat licenses."
    />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Start the hero footage during HTML parse instead of after React mounts and
      TeamsHero first renders — the difference is roughly the whole JS download,
      parse and hydrate.

      The href points at the SOURCE path on purpose: Vite rewrites it to the
      fingerprinted /assets/ filename at build time, which is the only way this
      hint and the <source> in TeamsHero can be guaranteed to name the same URL.
      A hand-written /assets/ path would silently become a second, wasted
      download the moment the file is re-encoded and its hash moves.

      `as="video"` is honoured unevenly — media destinations go down a separate
      loading path in some engines, which ignore the hint (and may note it in the
      console). It costs nothing where unsupported and buys a real head start
      where it works. If the console warning is unwanted, `rel="prefetch"` is the
      quiet equivalent at lower priority.
    -->
    <link rel="preload" as="video" type="video/mp4" href="/src/assets/hero-stadiums.mp4" />

    <!--
      Two theme-colors, not one. A single dark value paints the mobile browser bar
      #040811 even for a user reading in light mode, which reads as a rendering
      fault rather than as branding. The values are psl-page from each block of
      theme.css.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#040811" media="(prefers-color-scheme: dark)" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://gdseats.vercel.app/#website",
            "url": "https://gdseats.vercel.app/",
            "name": "G&D Seats",
            "alternateName": "Gridiron & Diamond Seats",
            "description": "Browse NFL personal seat licenses on an interactive seat map and see an AI valuation on every listing before you offer. Frontend demo, mock data.",
            "inLanguage": "en-US"
          },
          {
            "@type": "WebApplication",
            "@id": "https://gdseats.vercel.app/#app",
            "name": "G&D Seats",
            "url": "https://gdseats.vercel.app/",
            "isPartOf": { "@id": "https://gdseats.vercel.app/#website" },
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Any modern web browser",
            "browserRequirements": "Requires JavaScript",
            "image": "https://gdseats.vercel.app/og-image.png",
            "description": "A demo secondary market for NFL personal seat licenses, with an AI valuation on every listing. All data is generated; there is no backend.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          }
        ]
      }
    </script>

    <script>
      // Applied before paint so the first frame is already in the right theme.
      try {
        const stored = localStorage.getItem('psl-theme')
        const dark =
          stored === 'dark' ||
          (!stored && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch {}
    </script>

    <script>
      // Same shape as the theme script above, and here for the same reason: the
      // first frame has to be labelled correctly. `:lang()` rules, screen-reader
      // pronunciation and CJK font fallback all key off `<html lang>`, and none
      // of them wait for React to mount.
      //
      // The supported list is stated twice — here and in
      // src/shared/i18n/locales.ts — because static markup cannot import
      // TypeScript, exactly like the SEO strings above. `site.config.test.ts`
      // asserts the two agree, which is what stops them drifting.
      try {
        var stored = localStorage.getItem('psl-lang')
        var supported = ['en', 'es', 'pt-BR', 'ja']
        var pick = supported.indexOf(stored) > -1 ? stored : null
        if (!pick) {
          var nav = (navigator.language || 'en').toLowerCase()
          // `pt` of any flavour lands on pt-BR: it is the only Portuguese bundle
          // here, and Brazilian copy beats no copy for a pt-PT reader.
          pick =
            nav.indexOf('pt') === 0
              ? 'pt-BR'
              : nav.indexOf('es') === 0
                ? 'es'
                : nav.indexOf('ja') === 0
                  ? 'ja'
                  : 'en'
        }
        document.documentElement.lang = pick
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      G&amp;D Seats is a demo marketplace for NFL personal seat licenses, with an AI
      valuation on every listing. It needs JavaScript to run.
    </noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
